name: 福彩3D杀2码 自动更新

on:
  schedule:
    # 北京时间 22:00 / 23:30 / 01:00 = UTC 14:00 / 15:30 / 17:00
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 运行更新脚本(多源降级+期号校验)
        run: python auto_update.py || exit 1
      
      - name: 检查是否有新数据
        id: check
        run: |
          # 修复(2026-08-03 风险排除)：predict.json可能单独变更(无新开奖但回测率变化)，
          # 只diff CSV会误判"无变化"跳过提交，但部署步骤仍会用旧predict覆盖gh-pages
          if git diff --quiet data/fc3d-history.csv && git diff --quiet static/predict.json && git diff --quiet static/monitor_history.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "无新数据，跳过提交"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "检测到变化(CSV或预测或监控历史)"
          fi
      
      - name: 提交更新(含触发警报)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 修复(2026-08-03)：TRIGGER_ALERT.json 未跟踪，直接git add整文件会整体失败
          # 改用 git add -A data/ static/，不存在的文件自动忽略，不再吞错误
          git add -A data/ static/ || true
          git commit -m "自动更新$(TZ='Asia/Shanghai' date +%m%d) [skip ci]" || true
          git push
      
      - name: 准备部署文件
        run: |
          mkdir -p _site
          cp static/index.html _site/
          cp static/predict.json _site/
          cp static/TRIGGER_ALERT.json _site/ 2>/dev/null || echo '{"triggered":false}' > _site/TRIGGER_ALERT.json
      
      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
